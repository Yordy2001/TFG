<div class="flex h-screen bg-slate-50">
  <aside class="flex w-64 flex-col border-r border-slate-200 bg-white">
    <div class="flex items-center gap-2 border-b border-slate-200 px-4 py-4">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#003366] text-white">
        <mat-icon class="!h-5 !w-5 !text-[20px]">shield</mat-icon>
      </div>
      <div class="leading-tight">
        <p class="text-sm font-bold text-slate-900">GuardianEdu</p>
        <p class="text-[11px] text-slate-500">Prevención de Deserción</p>
      </div>
    </div>
    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of nav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-[#003366] text-white hover:bg-[#003366]"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          <mat-icon class="!h-5 !w-5 !text-[20px]">{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="border-t border-slate-200 p-3">
      <a routerLink="/profile" class="mb-2 flex items-center gap-2 rounded-lg px-1 py-1 hover:bg-slate-100" title="Ver mi perfil">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#003366] text-xs font-semibold text-white">
          {{ initials() }}
        </div>
        <div class="text-xs leading-tight">
          <p class="font-semibold text-slate-700">{{ authService.user()?.nombres }} {{ authService.user()?.apellidos }}</p>
          <span class="text-slate-500">{{ authService.user()?.role }}</span>
        </div>
      </a>
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        <mat-icon class="!h-5 !w-5 !text-[20px]">logout</mat-icon>
        Cerrar sesión
      </button>
    </div>
  </aside>
  <main class="flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
