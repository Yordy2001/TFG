<div class="flex h-screen bg-slate-50">
  <aside class="flex w-64 flex-col border-r border-slate-200 bg-white">
    <div class="flex h-16 items-center gap-2 border-b border-slate-200 px-4">
      <mat-icon class="text-indigo-600">school</mat-icon>
      <span class="text-sm font-semibold text-slate-800">Riesgo Escolar</span>
    </div>
    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of nav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          <mat-icon class="!h-5 !w-5 !text-[20px]">{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="border-t border-slate-200 p-3">
      <div class="mb-2 px-1 text-xs text-slate-500">
        {{ authService.user()?.nombres }} {{ authService.user()?.apellidos }}
        <br />
        <span class="font-semibold text-slate-700">{{ authService.user()?.role }}</span>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        <mat-icon class="!h-5 !w-5 !text-[20px]">logout</mat-icon>
        Cerrar sesión
      </button>
    </div>
  </aside>
  <main class="flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
