<div class="p-6">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-900">Seguimiento psicopedagógico</h1>
    <button
      type="button"
      (click)="showForm.set(!showForm())"
      class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500"
    >
      {{ showForm() ? 'Cancelar' : '+ Nuevo seguimiento' }}
    </button>
  </div>

  @if (showForm()) {
    <form [formGroup]="form" (ngSubmit)="submit()" class="mb-6 max-w-2xl space-y-3 rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-700">Estudiante</label>
        <select formControlName="estudianteId" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="" disabled>Seleccione un estudiante</option>
          @for (s of students(); track s.id) {
            <option [value]="s.id">{{ s.nombres }} {{ s.apellidos }} ({{ s.matricula }})</option>
          }
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-700">Fecha</label>
          <input type="date" formControlName="fecha" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-700">Próxima cita</label>
          <input type="date" formControlName="proximaCita" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-700">Motivo</label>
        <input formControlName="motivo" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-700">Observaciones (confidencial)</label>
        <textarea formControlName="observaciones" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-700">Acciones realizadas</label>
        <textarea formControlName="acciones" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
      </div>
      @if (message()) {
        <p class="text-sm text-red-600">{{ message() }}</p>
      }
      <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        Registrar seguimiento
      </button>
    </form>
  }

  <div class="rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
    <h2 class="mb-3 text-sm font-semibold text-slate-700">Seguimientos recientes</h2>
    <ul class="divide-y divide-slate-100 text-sm">
      @for (seg of recent(); track seg.id) {
        <li class="py-2">
          <a [routerLink]="['/students', seg.estudianteId]" class="font-medium text-indigo-600 hover:underline">
            {{ studentName(seg.estudianteId) }}
          </a>
          — {{ seg.fecha }} · {{ seg.estado }}
        </li>
      } @empty {
        <li class="py-4 text-center text-slate-400">Sin seguimientos registrados.</li>
      }
    </ul>
  </div>
</div>
