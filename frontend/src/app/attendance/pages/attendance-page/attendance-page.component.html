<div class="p-6">
  <h1 class="mb-6 text-xl font-semibold text-slate-900">Asistencia</h1>

  <div class="mb-6 flex flex-wrap items-end gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Asignación (curso — asignatura)</label>
      <select
        [ngModel]="selectedAssignmentId()"
        (ngModelChange)="selectAssignment($event)"
        class="w-full max-w-md rounded-lg border border-slate-300 px-3 py-2 text-sm"
      >
        @for (a of assignments(); track a.id) {
          <option [value]="a.id">{{ courseName(a.cursoId) }} — {{ subjectName(a.asignaturaId) }}</option>
        }
      </select>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Fecha</label>
      <input type="date" [ngModel]="fecha()" (ngModelChange)="fecha.set($event)" class="rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </div>
  </div>

  <div class="overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-slate-200">
    <table class="min-w-full divide-y divide-slate-200 text-sm">
      <thead class="bg-slate-50">
        <tr>
          <th class="px-4 py-2 text-left font-medium text-slate-500">Estudiante</th>
          <th class="px-4 py-2 text-left font-medium text-slate-500">Marcar</th>
          <th class="px-4 py-2 text-left font-medium text-slate-500">Estado</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (student of students(); track student.id) {
          <tr>
            <td class="px-4 py-2 font-medium text-slate-700">{{ student.nombres }} {{ student.apellidos }}</td>
            <td class="px-4 py-2">
              <div class="flex gap-2">
                @for (estado of estados; track estado) {
                  <button
                    type="button"
                    (click)="mark(student.id, estado)"
                    class="rounded-lg border border-slate-300 px-2 py-1 text-xs hover:bg-slate-100"
                  >
                    {{ estado }}
                  </button>
                }
              </div>
            </td>
            <td class="px-4 py-2 text-xs text-slate-500">
              {{ registrados().has(student.id) ? 'Registrado' : '—' }}
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="px-4 py-6 text-center text-slate-400">No hay estudiantes en este curso.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
